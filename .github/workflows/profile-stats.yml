name: Update GitHub stats dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile_stats.py"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: github-stats-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          USER_NAME: mjr267
        run: |
          mkdir -p generated/github-profile/stats
          python profile_stats.py
          python - <<'PY'
          import cairosvg
          for theme in ("dark", "light"):
              cairosvg.svg2png(
                  url=f"github_stats_{theme}.svg",
                  write_to=f"github_stats_{theme}.png",
                  output_width=2360,
                  output_height=1520,
              )
          PY
          mv github_stats_dark.svg github_stats_light.svg github_stats_dark.png github_stats_light.png generated/github-profile/stats/

      - name: Publish generated assets to outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Use a separate worktree so that the source branch stays untouched.
          git fetch origin outputs
          git worktree add --detach output-worktree origin/outputs
          mkdir -p output-worktree/github-profile/stats
          cp generated/github-profile/stats/* output-worktree/github-profile/stats/
          cd output-worktree
          git add -- github-profile/stats/
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats dashboard"
          git push origin HEAD:outputs
