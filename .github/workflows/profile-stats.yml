name: Update profile stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile_stats.py"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate profile stats
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          USER_NAME: mjr267
        run: python profile_stats.py

      - name: Commit generated SVGs
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "Profile stats are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: refresh profile stats"
          git push
