name: Update GitHub stats dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile_stats.py"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: github-stats-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          USER_NAME: mjr267
        run: |
          python profile_stats.py
          python - <<'PY'
          import cairosvg
          for theme in ("dark", "light"):
              cairosvg.svg2png(
                  url=f"github_stats_{theme}.svg",
                  write_to=f"github_stats_{theme}.png",
                  output_width=2360,
                  output_height=1520,
              )
          PY

      - name: Commit generated dashboard
        run: |
          FILES="github_stats_dark.svg github_stats_light.svg github_stats_dark.png github_stats_light.png"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Dashboard assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh GitHub stats dashboard"
          git pull --rebase origin main
          git push origin HEAD:main
